<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threat Intelligence RAG Chatbot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    .chat-wrap { display: flex; flex-direction: column; height: 600px; width: 100%; max-width: 700px; border: 1px solid #e0e0e0; border-radius: 16px; overflow: hidden; background: #ffffff; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .chat-header { padding: 14px 18px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; gap: 10px; background: #fafafa; }
    .chat-header-icon { width: 36px; height: 36px; border-radius: 50%; background: #FCEBEB; display: flex; align-items: center; justify-content: center; }
    .chat-header-text h2 { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    .status { font-size: 12px; display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #aaa; }
    .status-dot.online { background: #3B6D11; }
    .status-dot.offline { background: #A32D2D; }
    .status-text { color: #555; }
    .status-text.online { color: #3B6D11; }
    .status-text.offline { color: #A32D2D; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .msg { display: flex; gap: 8px; max-width: 85%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; margin-top: 2px; }
    .avatar.bot { background: #FCEBEB; color: #A32D2D; }
    .avatar.user { background: #E6F1FB; color: #185FA5; }
    .bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.7; }
    .msg.bot .bubble { background: #f5f5f5; color: #1a1a1a; border-bottom-left-radius: 4px; }
    .msg.user .bubble { background: #E6F1FB; color: #042C53; border-bottom-right-radius: 4px; }
    .sources-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .src-chip { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
    .src-chip.critical { background: #FCEBEB; color: #A32D2D; }
    .src-chip.high { background: #FAEEDA; color: #854F0B; }
    .src-chip.medium { background: #E6F1FB; color: #185FA5; }
    .src-chip.low { background: #EAF3DE; color: #3B6D11; }
    .typing { display: flex; align-items: center; gap: 4px; padding: 10px 14px; background: #f5f5f5; border-radius: 16px; border-bottom-left-radius: 4px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #999; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
    .suggestions { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-top: 1px solid #e0e0e0; background: #fafafa; }
    .chip { font-size: 12px; padding: 5px 12px; border: 1px solid #e0e0e0; border-radius: 20px; cursor: pointer; color: #555; background: #fff; }
    .chip:hover { border-color: #aaa; color: #1a1a1a; }
    .chat-input { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #e0e0e0; background: #fafafa; }
    .chat-input input { flex: 1; padding: 9px 14px; border: 1px solid #e0e0e0; border-radius: 20px; font-size: 14px; background: #fff; color: #1a1a1a; outline: none; }
    .chat-input input:focus { border-color: #E24B4A; }
    .chat-input button { width: 38px; height: 38px; border-radius: 50%; border: none; background: #E24B4A; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .chat-input button:hover { background: #A32D2D; }
    .chat-input button:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-wrap">
  <div class="chat-header">
    <div class="chat-header-icon">
      <i class="ti ti-shield-lock" style="font-size:18px; color:#A32D2D;"></i>
    </div>
    <div class="chat-header-text">
      <h2>Threat Intelligence RAG</h2>
      <div class="status" id="status">
        <div class="status-dot" id="status-dot"></div>
        <span class="status-text" id="status-text">Checking...</span>
      </div>
    </div>
  </div>

  <div class="chat-messages" id="messages">
    <div class="msg bot">
      <div class="avatar bot"><i class="ti ti-shield" style="font-size:14px;"></i></div>
      <div>
        <div class="bubble">Hi! Ask me anything about CVE vulnerabilities. I'll search the database and give you an AI-powered answer.</div>
      </div>
    </div>
  </div>

  <div class="suggestions" id="suggestions">
    <span class="chip" onclick="ask('What are critical RCE CVEs?')">Critical RCE CVEs</span>
    <span class="chip" onclick="ask('What is the mitigation for buffer overflow?')">Buffer overflow fix</span>
    <span class="chip" onclick="ask('High severity Windows CVEs?')">Windows CVEs</span>
    <span class="chip" onclick="ask('What are denial of service vulnerabilities?')">DoS attacks</span>
  </div>

  <div class="chat-input">
    <input type="text" id="qinput" placeholder="Ask about a CVE or vulnerability..." />
    <button onclick="ask()" id="send-btn" aria-label="Send">
      <i class="ti ti-send" style="font-size:16px;"></i>
    </button>
  </div>
</div>

<script>
  const API = 'https://shadow-coder-888-threat-intel-rag.hf.space';
  const msgs = document.getElementById('messages');
  const input = document.getElementById('qinput');
  const dot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  async function checkStatus() {
    try {
      const res = await fetch(API + '/health', { signal: AbortSignal.timeout(5000) });
      if (res.ok) {
        dot.className = 'status-dot online';
        statusText.className = 'status-text online';
        statusText.textContent = 'Online';
      } else { setOffline(); }
    } catch { setOffline(); }
  }

  function setOffline() {
    dot.className = 'status-dot offline';
    statusText.className = 'status-text offline';
    statusText.textContent = 'Offline';
  }

  checkStatus();

  function scrollDown() { msgs.scrollTop = msgs.scrollHeight; }

  function addMsg(role, text, sources) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const icon = role === 'bot' ? '<i class="ti ti-shield" style="font-size:14px;"></i>' : 'U';
    let html = '<div class="avatar ' + role + '">' + icon + '</div><div>';
    html += '<div class="bubble">' + text + '</div>';
    if (sources && sources.length > 0) {
      html += '<div class="sources-chips">' + sources.map(s => {
        const sev = (s.severity || 'medium').toLowerCase();
        return '<span class="src-chip ' + sev + '">' + s.cve_id + ' · ' + (s.severity || '') + '</span>';
      }).join('') + '</div>';
    }
    html += '</div>';
    div.innerHTML = html;
    msgs.appendChild(div);
    scrollDown();
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typing';
    div.innerHTML = '<div class="avatar bot"><i class="ti ti-shield" style="font-size:14px;"></i></div><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    msgs.appendChild(div);
    scrollDown();
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function ask(q) {
    const question = q || input.value.trim();
    if (!question) return;
    input.value = '';
    document.getElementById('suggestions').style.display = 'none';
    document.getElementById('send-btn').disabled = true;
    addMsg('user', question);
    addTyping();
    try {
      const res = await fetch(API + '/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      if (!res.ok) throw new Error('API error ' + res.status);
      const data = await res.json();
      removeTyping();
      addMsg('bot', data.answer, data.source_cves);
      dot.className = 'status-dot online';
      statusText.className = 'status-text online';
      statusText.textContent = 'Online';
    } catch (err) {
      removeTyping();
      addMsg('bot', 'Sorry, could not connect to the API. The server may be offline.');
      setOffline();
    } finally {
      document.getElementById('send-btn').disabled = false;
    }
  }

  input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>

</body>
</html>
